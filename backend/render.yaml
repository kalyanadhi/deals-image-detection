services:
  - type: web
    name: finwallet-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run start:migrate
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finwallet-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ALLOWED_ORIGINS
        value: https://kalyanadhi.github.io

databases:
  - name: finwallet-db
    databaseName: finwallet
    plan: free
